<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi PWA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#317EFB">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 2rem;
      background: #f0f4f8;
      color: #1a202c;
    }
    h1 { color: #2b6cb0; }
    .card {
      background: white;
      border-radius: 12px;
      padding: 2rem;
      max-width: 400px;
      margin: 2rem auto;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    button {
      background: #2b6cb0;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #1a4f8b; }
    .status { margin-top: 1rem; color: #38a169; }
  </style>
</head>
<body>
  <h1>🚀 Mi Aplicación Instalable</h1>
  <div class="card">
    <p>Esta app se puede instalar desde Chrome.</p>
    <p>Busca el icono de instalar en la barra de direcciones.</p>
    <button id="notifyBtn">¡Haz clic!</button>
    <p id="status" class="status"></p>
  </div>

  <script>
    // Registro del Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(reg => console.log('SW registrado correctamente', reg))
        .catch(err => console.error('Error al registrar SW', err));
    }

    // Evento de instalación (beforeinstallprompt)
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('status').textContent = '✅ Puedes instalar esta app';
    });

    // Botón de notificación
    document.getElementById('notifyBtn').addEventListener('click', () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(choice => {
          if (choice.outcome === 'accepted') {
            document.getElementById('status').textContent = '🎉 App instalada con éxito';
          } else {
            document.getElementById('status').textContent = '❌ Instalación cancelada';
          }
          deferredPrompt = null;
        });
      } else {
        alert('¡Hola! Esta app se puede instalar desde Chrome.');
      }
    });
  </script>
</body>
</html>
